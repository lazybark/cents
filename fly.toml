# Replace with your globally unique Fly app name.
app = "cents-CHANGE-ME"
primary_region = "waw"
kill_signal = "SIGTERM"
kill_timeout = "120s"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # One poller and one budget owner. Brief downtime during deployments.
  strategy = "rolling"

[env]
  TZ = "Europe/Kyiv"

[[mounts]]
  source = "cents_data"
  destination = "/data"

[[files]]
  guest_path = "/etc/cents/server.yml"
  secret_name = "CENTS_SERVER_CONFIG"

[[files]]
  guest_path = "/etc/cents/bot.yml"
  secret_name = "CENTS_BOT_CONFIG"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"

[[restart]]
  policy = "on-failure"
  retries = 10
